name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: bun audit --audit-level high
      - run: bun run verify
      - name: Verify release tag is the live default-branch head
        run: bun run check:release-ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify registry version is unoccupied
        run: |
          set -o pipefail
          gh api --paginate \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            '/orgs/CUNY-AI-Lab/packages/npm/cail-log/versions?per_page=100&state=active' \
            | jq -s 'add' > "$RUNNER_TEMP/cail-log-package-versions.json"
          CAIL_REGISTRY_VERSIONS_FILE="$RUNNER_TEMP/cail-log-package-versions.json" \
            bun run check:release-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        run: bun publish
        env:
          CAIL_REGISTRY_VERSIONS_FILE: ${{ runner.temp }}/cail-log-package-versions.json
          NPM_CONFIG_REGISTRY: https://npm.pkg.github.com
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
