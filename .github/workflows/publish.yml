name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@cuny-ai-lab"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      # actions/setup-node writes its .npmrc to a temp path and points
      # NPM_CONFIG_USERCONFIG at it. bun does not read that variable, so it
      # reached the registry unauthenticated and exited 1 straight after packing
      # without printing a reason — the pack output made an auth failure look
      # like a publish failure.
      #
      # Written into $HOME rather than the working tree, so the token cannot be
      # swept into a pack regardless of what `files` lists. Kept in the same step
      # as the publish, and with one env block, so exactly one step in this
      # workflow ever sees the token; test/security-regressions.test.ts asserts
      # that by requiring a single NODE_AUTH_TOKEN occurrence.
      - name: Publish to GitHub Packages
        run: |
          # setup-node points NPM_CONFIG_USERCONFIG at an .npmrc containing a
          # literal ${NODE_AUTH_TOKEN}, relying on npm to expand it. bun reads
          # that file but does not expand the variable, so it reached the
          # registry unauthenticated and exited 1 right after packing.
          unset NPM_CONFIG_USERCONFIG
          printf '@cuny-ai-lab:registry=https://npm.pkg.github.com\n' > .npmrc
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> .npmrc
          chmod 600 .npmrc
          bun publish
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
