name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Smoke test the built package on the declared Node baseline
        run: node --input-type=module -e "const cailLog = await import('./dist/index.js'); if (cailLog.CAIL_LOG_SCHEMA_VERSION !== 2) process.exit(1)"
