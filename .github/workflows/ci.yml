name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - name: Smoke test the built package on the declared Node baseline
        run: node --input-type=module -e "const cailLog = await import('./dist/index.js'); if (cailLog.CAIL_LOG_SCHEMA_VERSION !== 2) process.exit(1)"
